<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>

    <!-- ========== PROBLEM CARD ICONS ========== -->

    <!-- 01. Hidden fees: magnifying glass over dollar -->
    <symbol id="i-fees" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="27" cy="27" r="16"/>
        <line x1="38.5" y1="38.5" x2="52" y2="52"/>
        <path d="M30 19v3M30 32v3M33.5 22.5h-5.2c-1.6 0-2.8 1.2-2.8 2.6 0 1.4 1.1 2.5 2.5 2.6l3.6.4c1.4.1 2.5 1.2 2.5 2.6 0 1.4-1.2 2.6-2.8 2.6h-5.4"/>
      </g>
    </symbol>

    <!-- 02. Employee retention: doors with arrow -->
    <symbol id="i-retention" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="20" r="6"/>
        <path d="M12 44c0-6 4.5-10 10-10s10 4 10 10"/>
        <circle cx="44" cy="20" r="6"/>
        <path d="M34 44c0-6 4.5-10 10-10s10 4 10 10"/>
        <path d="M28 52h12M34 48l-4 4 4 4" opacity=".7"/>
      </g>
    </symbol>

    <!-- 03. Too expensive: balance scale -->
    <symbol id="i-cost" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="32" y1="14" x2="32" y2="52"/>
        <line x1="14" y1="14" x2="50" y2="14"/>
        <path d="M14 14l-6 14h12zM50 14l-6 14h12z"/>
        <path d="M8 28a6 6 0 0012 0M44 28a6 6 0 0012 0"/>
        <line x1="22" y1="52" x2="42" y2="52"/>
      </g>
    </symbol>

    <!-- 04. Compliance: shield with check -->
    <symbol id="i-compliance" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 8L14 14v14c0 12 8 22 18 26 10-4 18-14 18-26V14L32 8z"/>
        <path d="M22 32l7 7 13-14"/>
      </g>
    </symbol>

    <!-- ========== SERVICE CARD ICONS ========== -->

    <!-- 01. Plan design: compass / drafting -->
    <symbol id="i-design" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="14" r="3"/>
        <line x1="32" y1="17" x2="20" y2="50"/>
        <line x1="32" y1="17" x2="44" y2="50"/>
        <path d="M24 38h16"/>
        <path d="M16 50h32"/>
      </g>
    </symbol>

    <!-- 02. Compliance & admin: clipboard with check -->
    <symbol id="i-admin" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="14" y="12" width="36" height="44" rx="3"/>
        <rect x="22" y="8" width="20" height="8" rx="2"/>
        <path d="M22 30l5 5 10-12"/>
        <line x1="22" y1="44" x2="42" y2="44"/>
        <line x1="22" y1="50" x2="36" y2="50"/>
      </g>
    </symbol>

    <!-- 03. Investment management: ascending bars + line -->
    <symbol id="i-invest" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="10" y1="52" x2="54" y2="52"/>
        <rect x="14" y="38" width="6" height="14"/>
        <rect x="26" y="30" width="6" height="22"/>
        <rect x="38" y="22" width="6" height="30"/>
        <path d="M14 28l12-6 12-4 12-6"/>
        <circle cx="50" cy="12" r="2" fill="currentColor"/>
      </g>
    </symbol>

    <!-- 04. Employee education: book + person -->
    <symbol id="i-education" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="16" r="5"/>
        <path d="M32 22v8"/>
        <path d="M14 50V36c0-2 1.5-3 3-3h30c1.5 0 3 1 3 3v14"/>
        <path d="M32 33v17"/>
        <path d="M14 50h36"/>
        <path d="M22 41h8M34 41h8" opacity=".6"/>
      </g>
    </symbol>

    <!-- ========== WHY NOW ICONS ========== -->

    <!-- State mandates: stylised US shape with star -->
    <symbol id="i-states" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 22c2-2 6-3 9-2 3 1 5-1 8-1s5 2 8 1 6 0 8 1c4 1 6 0 9 1s7 3 10 2v18c-3 1-7-1-10 0s-6 2-9 1c-2-1-4 1-7 1s-5-2-8-2-7 1-9 0c-3-1-6-1-9-2z"/>
        <path d="M44 14l1.4 3.2 3.4.4-2.5 2.4.6 3.4-3-1.7-3 1.7.6-3.4-2.5-2.4 3.4-.4z" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <!-- Federal credits: dollar with growth -->
    <symbol id="i-credits" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="32" r="18"/>
        <path d="M32 18v4M32 42v4M38 24h-8c-2.2 0-4 1.6-4 3.6 0 1.9 1.5 3.4 3.4 3.6l5.2.4c1.9.2 3.4 1.7 3.4 3.6 0 2-1.8 3.6-4 3.6h-8"/>
        <path d="M50 14l8-6M58 8h-4M58 8v4" opacity=".7"/>
      </g>
    </symbol>

    <!-- ========== ABSTRACT / DECORATIVE ========== -->

    <!-- Trust badge: certified -->
    <symbol id="i-trust" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="26" r="14"/>
        <path d="M24 28l6 6 10-12"/>
        <path d="M22 38l-4 18 14-8 14 8-4-18"/>
      </g>
    </symbol>

    <!-- Phone (final CTA) -->
    <symbol id="i-phone" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 18c0-2 2-4 4-4h6l4 10-4 4c2 6 6 10 12 12l4-4 10 4v6c0 2-2 4-4 4h-2C28 50 14 36 14 22z"/>
      </g>
    </symbol>

    <!-- Calendar (schedule) -->
    <symbol id="i-calendar" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="14" width="44" height="40" rx="3"/>
        <line x1="10" y1="24" x2="54" y2="24"/>
        <line x1="20" y1="10" x2="20" y2="18"/>
        <line x1="44" y1="10" x2="44" y2="18"/>
        <circle cx="22" cy="34" r="2" fill="currentColor"/>
        <circle cx="32" cy="34" r="2" fill="currentColor"/>
        <circle cx="42" cy="34" r="2" fill="currentColor"/>
        <circle cx="22" cy="44" r="2" fill="currentColor"/>
        <circle cx="32" cy="44" r="2" fill="currentColor"/>
      </g>
    </symbol>

  </defs>
</svg>
